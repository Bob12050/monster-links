<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#75c8ee">
  <title>モンスター絵柄 再基準案</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #17395d;
      background: #75c8ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      padding: max(18px, env(safe-area-inset-top)) 14px max(28px, env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.8), transparent 34rem),
        linear-gradient(#76c9ef, #d8f3ff 45%, #f7fbff);
    }
    main {
      width: min(100%, 760px);
      margin: 0 auto;
    }
    header, .card, .note {
      background: rgba(255,255,255,.94);
      border: 2px solid rgba(31,99,156,.18);
      box-shadow: 0 12px 30px rgba(21,72,116,.16);
    }
    header {
      padding: 18px 18px 16px;
      border-radius: 24px;
      text-align: center;
    }
    .eyebrow {
      margin: 0 0 5px;
      color: #2876b8;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .14em;
    }
    h1 { margin: 0; font-size: clamp(23px, 7vw, 34px); line-height: 1.25; }
    header p { margin: 9px 0 0; font-weight: 700; line-height: 1.6; }
    .card {
      margin-top: 14px;
      padding: 12px;
      border-radius: 28px;
    }
    figure { margin: 0; }
    .rank {
      display: inline-flex;
      min-width: 48px;
      min-height: 32px;
      align-items: center;
      justify-content: center;
      margin: 3px 0 10px 4px;
      border-radius: 999px;
      color: #fff;
      background: #6f43a9;
      font-weight: 1000;
      box-shadow: inset 0 -3px 0 rgba(0,0,0,.18);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 20px;
      background: #eef8ff;
    }
    figcaption {
      padding: 14px 8px 6px;
      font-size: 18px;
      font-weight: 900;
      text-align: center;
    }
    .open {
      display: flex;
      min-height: 50px;
      margin-top: 10px;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      color: #fff;
      background: #2478c7;
      font-weight: 900;
      text-decoration: none;
      box-shadow: inset 0 -4px 0 rgba(0,0,0,.2);
    }
    .open:focus-visible { outline: 4px solid #0d3f70; outline-offset: 3px; }
    .note {
      margin-top: 14px;
      padding: 18px;
      border-radius: 22px;
      line-height: 1.7;
    }
    .note h2 { margin: 0 0 7px; font-size: 18px; }
    .note ul { margin: 0; padding-left: 1.25em; }
    .status {
      margin: 13px 0 0;
      padding: 10px 12px;
      border-radius: 13px;
      background: #fff2d7;
      color: #6a4710;
      font-weight: 900;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">STYLE RESET / REVIEW ONLY</p>
      <h1>モンスター絵柄 再基準案</h1>
      <p>参考画像の「手描き感・分かりやすい輪郭・表情のある魔物」へ戻した、虫ではない再試作です。</p>
    </header>

    <section class="card" aria-labelledby="monster-name">
      <span class="rank">S</span>
      <figure>
        <img src="./phoenixdrake-direction.png?v=preview-2" width="1254" height="1254" alt="赤い竜の体、炎のような大翼と鳥のくちばしを持つフェニックスドレイク再基準案">
        <figcaption id="monster-name">フェニックスドレイク</figcaption>
      </figure>
      <a class="open" href="./phoenixdrake-direction.png?v=preview-2">画像だけを大きく表示</a>
    </section>

    <section class="note">
      <h2>今回戻した基準</h2>
      <ul>
        <li>線の強弱がある手描き風の輪郭</li>
        <li>細部より、ひと目で分かる体型と表情</li>
        <li>発光・宝石・装甲・エフェクトを控えめに</li>
        <li>Sランクの強さは、宝石や発光ではなく大翼・体格・姿勢で表現</li>
        <li>昆虫らしさ、機械装甲、細かな鱗の描き込みは使わない</li>
      </ul>
      <p class="status">確認用のみ。ゲームにはまだ反映していません。</p>
    </section>
  </main>
</body>
</html>
