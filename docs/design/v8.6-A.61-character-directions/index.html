<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102b49">
  <title>Monster Links Sランクモンスター 改訂3体</title>
  <style>
    :root{
      color-scheme:light;
      --ink:#183a5b;
      --muted:#5e7488;
      --blue:#1773c7;
      --paper:#fffdf7;
      --line:#d4e0e8;
      --sky:#dff3ff;
    }
    *{box-sizing:border-box}
    html{background:#bfe7fb}
    body{
      margin:0;
      color:var(--ink);
      background:
        radial-gradient(circle at 12% 0,rgba(255,255,255,.9),transparent 27rem),
        linear-gradient(180deg,#91d5f6 0,#eaf7fc 24rem,#f5f2e9 100%);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
    }
    header{
      padding:max(24px,env(safe-area-inset-top)) 18px 22px;
      text-align:center;
    }
    header small{
      display:block;
      margin-bottom:7px;
      color:#155b91;
      font-size:12px;
      font-weight:900;
      letter-spacing:.15em;
    }
    h1{margin:0;font-size:clamp(25px,7vw,42px);line-height:1.18}
    header p{max-width:680px;margin:12px auto 0;color:#35566f;font-size:14px;line-height:1.7}
    main{width:min(1120px,100%);margin:0 auto;padding:0 12px 44px}
    .notice{
      margin:0 auto 16px;
      padding:12px 15px;
      border:1px solid rgba(26,105,161,.24);
      border-radius:15px;
      background:rgba(255,255,255,.8);
      box-shadow:0 5px 15px rgba(43,95,124,.1);
      font-size:13px;
      font-weight:700;
      line-height:1.6;
      text-align:center;
    }
    .grid{display:grid;gap:18px}
    article{
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:20px;
      background:var(--paper);
      box-shadow:0 12px 28px rgba(37,76,104,.17);
    }
    .label{
      display:flex;
      min-height:55px;
      align-items:center;
      justify-content:space-between;
      padding:10px 15px;
      border-bottom:1px solid var(--line);
    }
    .label b{font-size:19px}
    .label span{color:var(--muted);font-size:12px;font-weight:700}
    figure{margin:0;background:#eef6fb}
    img{display:block;width:100%;height:auto}
    .open{
      display:flex;
      min-height:48px;
      align-items:center;
      justify-content:center;
      color:var(--blue);
      font-size:14px;
      font-weight:900;
      text-decoration:none;
    }
    .open:focus-visible{outline:3px solid #15549d;outline-offset:-4px}
    footer{padding:0 18px max(24px,env(safe-area-inset-bottom));color:#527086;font-size:12px;line-height:1.6;text-align:center}
    @media(min-width:860px){
      main{padding-right:22px;padding-left:22px}
      .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
      article{border-radius:18px}
      .label{min-height:60px}
    }
  </style>
</head>
<body>
  <header>
    <small>MONSTER LINKS / S-RANK MONSTERS</small>
    <h1>Sランクモンスター 改訂3体</h1>
    <p>2Dらしい覚えやすさは残し、目・牙・爪・姿勢を調整してSランクの威圧感を強めました。画像を押すと大きく確認できます。</p>
  </header>
  <main>
    <p class="notice">ぷるミンを含むスライム系の見た目は変更しません。今回は「可愛すぎる」を抑えた闇・光竜・毒キマイラの改訂版です。</p>
    <div class="grid">
      <article>
        <div class="label"><b>デモンロード</b><span>Sランク / 闇</span></div>
        <figure><a href="direction-1.webp?rev=menace-v2"><img src="direction-1.webp?rev=menace-v2" width="1536" height="1024" alt="鋭い三つ目、巨大な巻き角、ぼろぼろの翼と大爪を持つ威圧的な紫色のデモンロード改訂案" fetchpriority="high"></a></figure>
        <a class="open" href="direction-1.webp?rev=menace-v2">画像だけを大きく開く</a>
      </article>
      <article>
        <div class="label"><b>ゼニスドラゴン</b><span>Sランク / 光・竜</span></div>
        <figure><a href="direction-2.webp?rev=menace-v2"><img src="direction-2.webp?rev=menace-v2" width="1536" height="1024" alt="鋭い青い目、太陽のような金色のたてがみ、大きな赤い翼と鉤爪を持つ白いゼニスドラゴン改訂案" loading="lazy"></a></figure>
        <a class="open" href="direction-2.webp?rev=menace-v2">画像だけを大きく開く</a>
      </article>
      <article>
        <div class="label"><b>ヴェノムキマイラ</b><span>Sランク / 毒・キマイラ</span></div>
        <figure><a href="direction-3.webp?rev=menace-v2"><img src="direction-3.webp?rev=menace-v2" width="1536" height="1024" alt="低く身構えた紫の猛獣、緑の毒蛇、黒紫のサソリ尾を合わせた獰猛なヴェノムキマイラ改訂案" loading="lazy"></a></figure>
        <a class="open" href="direction-3.webp?rev=menace-v2">画像だけを大きく開く</a>
      </article>
    </div>
  </main>
  <footer>3体の方向性が合えば、次はゲーム内の立ち絵へ順番に反映します。</footer>
</body>
</html>
